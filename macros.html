  if(nk&&!has(t,'cuanto me queda','me queda hoy','margen')&&(!MACRO_KEYS.includes(nk)||macroDia)&&!has(t,'cuanta proteina necesito','proteina necesito','proteina al dia','como llego a la prote','llego a la proteina','cubrir la proteina'))
    return nutriAnswer(t,nk);
  if(!nk&&(has(t,'micronutriente','micros','vitaminas','minerales','que me falta','que me esta faltando','falta algo','como voy de micro','estoy bien de')))
    return microOverview(t);

  // cuánto me queda
  if(has(t,'cuanto me queda','que me queda','cuanto llevo','como voy','me queda hoy','margen')){
    let a=`Hoy llevas <b>${r0(d.t.kcal)}</b> de <b>${r0(d.presupuesto)} kcal</b>`;
    a+=d.cal>0?` (tu objetivo de ${d.T.kcal} más ${r0(d.cal)} del cardio).`:'.';
    a+=`\n\nTe quedan <b>${r0(d.restan)} kcal</b>.\n\n• Proteína: ${r0(d.t.prot)} / ${d.T.prot} g${d.faltaP>0?` — faltan <b>${r0(d.faltaP)} g</b>`:' ✓'}\n• Carbohidratos: ${r0(d.t.carb)} / ${d.T.carb} g\n• Grasa: ${r0(d.t.grasa)} / ${d.T.grasa} g`;
    if(d.faltaP>20)a+=`\n\nPara cubrir la proteína que falta: ${protTip(d.faltaP)}.`;
    return{a,chips:['¿Cómo llego a la proteína?','¿Qué toca hoy en el gym?']};
  }

  // proteína que falta
  if(has(t,'llego a la proteina','cubrir la proteina','falta proteina','como llego a la prote')){
    if(d.faltaP<=0)return{a:`Ya la tienes cubierta: <b>${r0(d.t.prot)} g</b> de ${d.T.prot} g. Nada que añadir.`};
    let a=`Te faltan <b>${r0(d.faltaP)} g</b> de proteína (llevas ${r0(d.t.prot)} de ${d.T.prot} g).\n\nOpciones aproximadas:\n`;
    PROTEIN_SOURCES.forEach(src=>{a+=`\n• ${porcion(src,d.faltaP)}`});
    a+=`\n\nTe quedan ${r0(d.restan)} kcal de margen, así que ${d.restan>400?'te cabe de sobra':'tira de fuentes magras: pollo, atún al natural o queso batido'}.`;
    return{a};
  }

  // qué toca hoy
  if(has(t,'que toca','que entreno','rutina de hoy','toca hoy','que hago hoy')){
    const dow=new Date().getDay(),pl=planOf(dow);
    if(pl.rest)return{a:`Hoy es <b>descanso</b>. La siguiente sesión es ${nextTrainLabel(dow)}.\n\nEl descanso no es tiempo perdido: el músculo crece ahí. Si quieres moverte, camina.`};
    let a=`Hoy toca <b>${pl.t} — ${pl.sub.toLowerCase()}</b>:\n`;
    dayEx(dow).forEach((id,i)=>{const x=getEx(id);if(!x)return;a+=`\n${i+1}. ${esc(x.n)}${x?` <em style="display:inline;border:none;padding:0;margin:0">(${x.lo}-${x.hi})</em>`:''}`});
    a+=`\n\n2 aproximaciones y 1 serie efectiva al fallo, como siempre.`;
    return{a,chips:['¿Cuándo subo peso?','¿Cuánto descanso entre series?']};
  }

  // cuánto quemo con X
  if(has(t,'cuanto quemo','cuantas calorias quemo','calorias quema','gasto calorico')){
    const min=n.min||30;
    let a=`Con tus <b>${S.peso} kg</b>, en <b>${min} min</b>:\n`;
    S.cardios.slice(0,9).forEach(c=>{a+=`\n• ${c.n}: <b>${r0(cardioKcal(c.met,min))} kcal</b>`});
    a+=`<em>Estimación por METs. El gasto real cambia con el ritmo y tu forma física.</em>`;
    return{a};
  }

  // dolor o lesión: prioridad sobre el nombre del ejercicio que aparezca en la frase
  if(has(t,'me duele','dolor','molesta','molestia','lesion','pinza','pincha','me hace dano'))
    return{a:dolorAnswer(t)};

  // ejercicio concreto
  const ex=exerciseAnswer(t);
  if(ex)return ex;

  // base de conocimiento
  const kb=kbAnswer(t);
  if(kb)return kb;

  // un alimento de tu lista: ficha completa
  const ff=findFoods(t);
  if(ff.length&&!has(t,'ejercicio','entren','series')){
    return{a:foodCard(ff[0]),chips:['¿Qué me falta hoy?','¿Cuánto me queda hoy?']};
  }

  // no lo sé: honestidad, no invención
  return{a:`De eso no tengo respuesta preparada, y prefiero decírtelo antes que inventarme algo.\n\nSé responder bien sobre:\n• Encajar una comida en tu día («si ceno X kcal, qué me queda»)\n• Cualquier ejercicio de tu rutina: qué músculos trabaja y en qué porcentaje\n• Qué comida te aportó más de cualquier nutriente (magnesio, hierro, proteína…), hoy, ayer o esta semana\n• De dónde sacar lo que te falta, comparar alimentos y qué micros llevas\n• Proteína, creatina, déficit, volumen, descansos, fallo, sueño, cardio\n• Cuándo te toca subir peso y qué entrenas hoy`,
    chips:['¿Cuánto me queda hoy?','¿Qué me dio más magnesio?','¿Qué me falta hoy?','¿Cuándo subo peso?']};
}

/* Arrastrar la cabecera (o la barrita) hacia abajo cierra la hoja.
   Funciona en el chat y en las hojas normales, que se recrean solas,
   por eso escucho en el documento en vez de en cada elemento. */
let dragS=null;
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,textarea,select'))return;
  const h=e.target.closest('.chat-top,.grab');
  if(!h)return;
  const panel=h.closest('.chat-body,.sheet-wrap');
  if(!panel)return;
  dragS={y:e.clientY,dy:0,panel,sheet:panel.closest('.sheet')};
  panel.style.transition='none';
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!dragS)return;
  dragS.dy=Math.max(0,e.clientY-dragS.y);
  dragS.panel.style.transform='translateY('+dragS.dy+'px)';
},{passive:true});
function endDrag(){
  if(!dragS)return;
  const {panel,sheet,dy}=dragS; dragS=null;
  panel.style.transition='transform .3s cubic-bezier(.22,1,.36,1)';
  const limpia=()=>{panel.style.transform='';panel.style.transition=''};
  if(dy>90){
    panel.style.transform='translateY(100%)';
    setTimeout(()=>{if(sheet)sheet.classList.remove('on');limpia()},260);
  }else limpia();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* --- interfaz --- */
function openChat(){
  document.getElementById('chat').classList.add('on');
  if(!chatLog.length){
    const d=dayState();
    pushMsg('a',`Hola${S.me.name?' '+esc(S.me.name):''}. Llevas <b>${r0(d.t.kcal)}</b> de <b>${r0(d.presupuesto)} kcal</b> y te quedan <b>${r0(d.restan)}</b>.\n\nPregúntame lo que quieras sobre comida o entreno.`,
      ['Si ceno una hamburguesa de 800 kcal, ¿qué me queda?','¿Qué trabaja el peck deck?','¿Cuánta proteína necesito al día?','¿Qué toca hoy en el gym?']);
  }
  setTimeout(()=>{const i=document.getElementById('chatIn');if(i)i.focus()},350);
}
function closeChat(){document.getElementById('chat').classList.remove('on')}

// Añade un mensaje SIN recrear el input, para que no se cierre el teclado.
function pushMsg(who,html,chips){
  chatLog.push({who,html});
  const sc=document.getElementById('chatScroll');
  const d=document.createElement('div');
  d.className='msg '+who;
  d.innerHTML=html;
  sc.appendChild(d);
  if(chips&&chips.length){
    const c=document.createElement('div');
    c.className='chips';
    chips.forEach(x=>{
      const b=document.createElement('button');
      b.textContent=x;
      b.onclick=()=>ask(x);
      c.appendChild(b);
    });
    sc.appendChild(c);
  }
  sc.scrollTop=sc.scrollHeight;
}
function sendChat(){
  const i=document.getElementById('chatIn');
  const v=i.value.trim();
  if(!v)return;
  i.value='';
  ask(v);
}
function ask(q){
  pushMsg('u',esc(q));
  const sc=document.getElementById('chatScroll');
  const t=document.createElement('div');
  t.className='msg a typing';
  t.innerHTML='<i></i><i></i><i></i>';
  sc.appendChild(t);sc.scrollTop=sc.scrollHeight;
  setTimeout(()=>{
    t.remove();
    let r;
    try{r=macrowAnswer(q)}
    catch(e){r={a:'Algo se me ha atascado con esa pregunta. Prueba a decirla de otra forma.'}}
    pushMsg('a',r.a,r.chips);
  },340);
}

function importar(){document.getElementById('fileIn').click()}
function onFile(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d;
    try{d=JSON.parse(rd.result)}
    catch(e){alert('Ese archivo no es un .json válido.');return}
    if(!d||typeof d!=='object'){alert('Ese archivo no tiene datos de Macrow.');return}
    const nf=Array.isArray(d.foods)?d.foods.length:0;
    const ne=Array.isArray(d.entries)?d.entries.length:0;
    const nw=Array.isArray(d.workouts)?d.workouts.length:0;
    if(!nf&&!ne&&!nw){alert('No encontré alimentos ni registros en ese archivo.');return}
    const msg='El archivo trae '+nf+' alimentos, '+ne+' comidas y '+nw+' sesiones.\n\n'+
      'Aceptar: añade lo que falte sin borrar lo tuyo.\n'+
      'Cancelar: no hace nada.';
    if(!confirm(msg))return;
    mergeData(d);
  };
  rd.readAsText(file);
}
// Fusiona sin duplicar: los alimentos se comparan por nombre, el resto por id.
function mergeData(d){
  let addF=0,addE=0,addW=0,addC=0,addM=0;
  const byName=new Map(S.foods.map(f=>[f.n.toLowerCase().trim(),f]));
  (d.foods||[]).forEach(f=>{
    if(!f||!f.n)return;
    const key=String(f.n).toLowerCase().trim();
    const im=cleanMic(f.m||{});
    const ex=byName.get(key);
    if(ex){ // repetido: no se duplica, pero se le completan los micros que le falten
      if(im&&!ex.combo){ex.m=ex.m||{};let ch=false;
        for(const k in im)if(!(k in ex.m)){ex.m[k]=im[k];ch=true}
        if(ch){ex.mDb=1;addM++}}
      return;
    }
    const nf={id:'i'+Date.now()+Math.random().toString(36).slice(2,6),
      n:f.n,k:+f.k||0,p:+f.p||0,c:+f.c||0,g:+f.g||0,combo:!!f.combo,used:0};
    if(im){nf.m=im;nf.mDb=1}
    if(f.u&&f.u.n&&+f.u.g>0){nf.u={n:String(f.u.n).slice(0,20),g:+f.u.g};nf.uDb=1}
    S.foods.push(nf);byName.set(key,nf);addF++;
  });
  applyMicroDB();
  const ids=new Set(S.entries.map(e=>e.id));
  (d.entries||[]).forEach(e=>{if(e&&e.id&&!ids.has(e.id)){S.entries.push(e);ids.add(e.id);addE++}});
  const wids=new Set(S.workouts.map(w=>w.id));
  (d.workouts||[]).forEach(w=>{if(w&&w.id&&!wids.has(w.id)){S.workouts.push(w);wids.add(w.id);addW++}});
  const cids=new Set(S.cardioLog.map(c=>c.id));
  (d.cardioLog||[]).forEach(c=>{if(c&&c.id&&!cids.has(c.id)){S.cardioLog.push(c);cids.add(c.id);addC++}});
  const cn=new Set(S.cardios.map(c=>c.n.toLowerCase()));
  (d.cardios||[]).forEach(c=>{if(c&&c.n&&!cn.has(String(c.n).toLowerCase())){
    S.cardios.push({id:'ci'+Date.now()+Math.random().toString(36).slice(2,5),n:c.n,met:+c.met||5,d:c.d||''});
    cn.add(String(c.n).toLowerCase())}});
  if(d.gym)Object.keys(d.gym).forEach(k=>{if(!S.gym[k])S.gym[k]=d.gym[k]});
  save();render(true);
  if(window.Fire)window.Fire.push();
  alert('Importado: '+addF+' alimentos, '+addE+' comidas, '+addW+' sesiones y '+addC+' cardios.'+
    (addM?'\nMicronutrientes completados en '+addM+' alimentos.':''));
}
function borrar(){
  if(!confirm('Se borran todos los registros, alimentos, entrenos y la sala compartida. No se puede deshacer.'))return;
  S={foods:SEED.slice(),entries:[],exercises:[],workouts:[],exV:0,
     cardios:CARSEED.slice(),cardioLog:[],gym:{},
     peso:75,edad:30,sexo:'h',kcal:2000,macros:{prot:1.8,grasa:1},
     me:{name:'',room:'',fbConfig:null},target:null};
  migrateExercises();applyMicroDB();
  S.target=computeTarget();save();render(true);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

<script type="module">
// Sincronización opcional con Firebase. Sin sala configurada no hace nada.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, doc, setDoc, collection, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

let fbDb=null, fbAuth=null, unsub=null;

window.Fire={
  ready:false,
  configure(){
    if(unsub){try{unsub()}catch(e){}unsub=null;}
    window.Fire.ready=false;
    const me=(window.getState&&window.getState().me)||{};
    const {fbConfig,room,name}=me;
    if(!fbConfig||!room||!name)return;
    try{
      const app=initializeApp(fbConfig,'macrow-'+Date.now());
      fbAuth=getAuth(app);
      fbDb=getFirestore(app);
      signInAnonymously(fbAuth).then(()=>{
        window.Fire.ready=true;
        unsub=onSnapshot(collection(fbDb,'rooms',room,'members'),(snap)=>{
          const list=[];
          snap.forEach(d=>{if(d.id!==name)list.push({name:d.id,...d.data()})});
          if(window.setOthers)window.setOthers(list);
        },(err)=>console.warn('Macrow: sala no accesible',err));
        window.Fire.push();
      }).catch(err=>console.warn('Macrow: no se pudo conectar la sala',err));
    }catch(err){console.warn('Macrow: configuración de Firebase inválida',err)}
  },
  push(){
    if(!window.Fire.ready||!fbDb)return;
    const me=(window.getState&&window.getState().me)||{};
    if(!me.room||!me.name)return;
    try{
      setDoc(doc(fbDb,'rooms',me.room,'members',me.name),{
        lifts:window.weeklyLifts(),
        adherence:window.weeklyAdherence(),
        updatedAt:serverTimestamp()
      });
    }catch(err){console.warn('Macrow: no se pudo sincronizar',err)}
  }
};
</script>
