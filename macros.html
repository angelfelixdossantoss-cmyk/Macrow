<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macrow">
<meta name="theme-color" content="#0B0D0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Macrow</title>
<style>
:root{
  --bg:#0B0D0F;
  --s1:#131619;
  --s2:#1A1E22;
  --s3:#23282E;
  --line:#262C32;
  --ink:#ECEEF0;
  --muted:#858C95;
  --dim:#555C65;
  --accent:#FF7A45;
  --accent-2:#FFB070;
  --prot:#5BC8AF;
  --carb:#E9B44C;
  --fat:#E4728C;
  --muscle:#262C33;
  --base:#1C2126;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(90% 45% at 50% -8%, rgba(255,122,69,.13), transparent 70%),
    radial-gradient(60% 35% at 100% 100%, rgba(91,200,175,.05), transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:650}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* ---- cabeceras ---- */
.datebar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.datebar h1{margin:0;font-size:22px;font-weight:750;letter-spacing:-.025em}
.datebar h1.small{font-size:16px;font-weight:650;letter-spacing:-.01em}
.datebar .today{display:block;font-size:11px;color:var(--muted);font-weight:450;letter-spacing:0;text-transform:none}
.navbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--s1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);
  transition:transform .15s var(--ease),background .2s}
.navbtn:active{transform:scale(.92)}
.navbtn:disabled{opacity:.25}

/* ---- calorías ---- */
.gauge-top{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.gauge-top .big{font-size:44px;font-weight:600;line-height:1}
.gauge-top .of{font-size:15px;color:var(--muted)}
.gauge-top .unit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:auto;text-align:right}
.rule{position:relative;height:14px;background:var(--s2);border-radius:999px;overflow:visible}
.rule-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
  box-shadow:0 0 18px rgba(255,122,69,.35);
  transition:width 1s var(--ease)}
.rule-fill.over{background:var(--fat);box-shadow:0 0 18px rgba(228,114,140,.4)}
.rule-ticks{position:absolute;inset:0;pointer-events:none}
.rule-ticks i{position:absolute;top:3px;bottom:3px;width:1px;background:rgba(255,255,255,.08)}
.rule-target{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}

.rails{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.rail{display:flex;align-items:center;gap:10px}
.rail-key{width:14px;font-size:11px;font-weight:700;font-family:var(--mono)}
.rail-track{flex:1;height:6px;background:var(--s2);border-radius:999px;overflow:hidden}
.rail-fill{height:100%;border-radius:999px;transition:width .9s var(--ease)}
.rail-val{width:92px;text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.rail-val b{font-weight:600}
.rail-val span{color:var(--muted)}
.k-p .rail-key{color:var(--prot)}.k-p .rail-fill{background:var(--prot)}
.k-c .rail-key{color:var(--carb)}.k-c .rail-fill{background:var(--carb)}
.k-g .rail-key{color:var(--fat)}.k-g .rail-fill{background:var(--fat)}

/* ---- "hoy toca" ---- */
.toca{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:linear-gradient(135deg,rgba(255,122,69,.16),rgba(255,122,69,.03) 60%),var(--s1);
  border:1px solid rgba(255,122,69,.28);border-radius:18px;padding:14px 16px;margin-bottom:12px;
  transition:transform .15s var(--ease)}
.toca:active{transform:scale(.985)}
.toca .t{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-top:2px}
.toca .s{font-size:12px;color:var(--muted);margin-top:1px}
.toca .go{margin-left:auto;font-size:20px;color:var(--accent)}
.toca.rest{background:var(--s1);border-color:var(--line)}
.toca.rest .go{color:var(--muted)}

/* ---- comidas ---- */
.meal{padding:14px 16px}
.meal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.meal-kcal{font-family:var(--mono);font-size:12px;color:var(--muted)}
.line{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.meal-head + .line{border-top:none}
.line-name{flex:1;font-size:14px;min-width:0}
.line-name em{font-style:normal;color:var(--muted);font-size:12px;font-family:var(--mono)}
.line-kcal{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.line-del{color:var(--dim);font-size:18px;padding:0 2px;line-height:1}
.add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.add button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:12.5px;color:var(--ink);background:var(--s2);transition:transform .15s var(--ease),background .2s}
.add button:active{transform:scale(.95);background:var(--s3)}
.empty{color:var(--muted);font-size:13px;padding:4px 0}

/* ---- nav inferior ---- */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:496px;margin:0 auto;display:flex;padding:6px;z-index:40;
  background:rgba(19,22,25,.82);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/6);
  border-radius:14px;background:var(--s3);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .42s var(--ease)}
.tab-ind::after{content:"";position:absolute;left:50%;bottom:5px;width:16px;height:2px;margin-left:-8px;
  border-radius:2px;background:var(--accent)}
.tabs button{position:relative;z-index:1;flex:1;padding:13px 0 14px;font-size:8.6px;letter-spacing:.05em;
  text-transform:uppercase;font-weight:700;color:var(--muted);transition:color .25s}
.tabs button[aria-current="page"]{color:var(--ink)}

/* ---- formularios ---- */
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px}
.field input,.field select,.ta{width:100%;padding:12px 13px;background:var(--s2);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:var(--mono);
  transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.field select{font-family:var(--sans);font-size:15px}
.ta{font-size:12.5px;resize:vertical}
.field input:focus,.field select:focus,.ta:focus,.search:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,122,69,.16)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calcline{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.calcline .num{font-weight:600}
.btn{display:block;width:100%;padding:15px;background:var(--accent);color:#1A0C05;
  border-radius:14px;font-size:14.5px;font-weight:750;letter-spacing:.01em;
  box-shadow:0 8px 24px rgba(255,122,69,.22);transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500;box-shadow:none}
h2.sec{font-size:13px;font-weight:700;margin:28px 0 12px;letter-spacing:.02em;color:var(--ink)}

/* ---- hoja inferior ---- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease both}
.sheet-wrap{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
  max-height:90vh;display:flex;flex-direction:column;
  background:var(--s1);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
  animation:up .42s var(--ease) both}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet-x{position:absolute;top:14px;right:16px;z-index:6}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:38px;height:4px;background:var(--s3);border-radius:2px;margin:6px auto 16px;
  position:relative;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:-60px;right:-60px;top:-12px;bottom:-16px}
.sheet h2{margin:0 0 4px;padding-right:44px;font-size:20px;font-weight:750;letter-spacing:-.02em}
.search{width:100%;padding:13px;background:var(--s2);border:1px solid var(--line);
  border-radius:12px;font-size:16px;margin:10px 0 6px;color:var(--ink)}
.hit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 0;border-bottom:1px solid var(--line)}
.hit-name{flex:1;font-size:14.5px}
.hit-name em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.hit-go{font-size:18px;color:var(--dim)}
.tag{display:inline-block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted);margin-left:6px;vertical-align:1px}
.preview{background:var(--s2);border-radius:14px;padding:14px;margin:14px 0;display:flex;justify-content:space-between;text-align:center}
.preview div{flex:1}
.preview .v{font-family:var(--mono);font-size:19px;font-weight:600}


/* ---- rutinas (splits) y arrastrar ---- */
.splitbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;margin:0 0 14px;
  background:var(--s1);border:1px solid var(--line);border-radius:14px}
.splitbar b{flex:1;font-size:14.5px;font-weight:650;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splitbar em{font-style:normal;font-size:12px;color:var(--accent)}
.splitbar:active{transform:scale(.985)}
#exList .exrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#exList.dragging .exrow{animation:none!important;transition:none}
#exList .exrow.lift{position:relative;z-index:5;border-color:var(--accent);background:var(--s2);
  box-shadow:0 12px 30px rgba(0,0,0,.45);transform-origin:center;opacity:.97}
body.dragmode{-webkit-user-select:none;user-select:none}
.spr{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.spr.on{border-color:var(--accent)}
.spr .nm{flex:1;min-width:0}.spr .nm b{display:block;font-size:14.5px;font-weight:650}
.spr .nm span{font-size:11.5px;color:var(--muted)}
.spa{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.spa button{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink)}
.spa button.pri{background:var(--accent);border-color:var(--accent);color:#1A0C05;font-weight:650}
.spa button.dng{color:var(--fat);border-color:rgba(228,114,140,.4)}
.spday{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.spday .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.spday .hd b{font-size:14px}
.spday input{width:100%;padding:10px 12px;background:var(--s2);color:var(--ink);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:var(--sans);font-size:14px}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.pkrow.on{border-color:var(--accent)}
.pkrow .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:13px;color:#1A0C05;flex:none}
.pkrow.on .bx{background:var(--accent);border-color:var(--accent)}
.pkrow .pn{flex:1;font-size:14px}.pkrow em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono)}
.line-name.tap{cursor:pointer}

/* ---- entreno ---- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.dchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 9px;
  border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);
  transition:transform .15s var(--ease),background .25s,color .25s,border-color .25s}
.dchip:active{transform:scale(.93)}
.dchip i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.8}
.dchip.rest i{background:var(--dim);opacity:.6}
.dchip.today{border-color:rgba(255,122,69,.45)}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip.on i{background:var(--bg)}
.dayhead .eyebrow{color:var(--accent)}
.dayhead h1{margin:4px 0 2px;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.dayhead .sub{font-size:14px;color:var(--muted)}
.proto{display:flex;gap:8px;align-items:center;margin:12px 0 14px;font-size:12px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .pill{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 10px}

.mapcard{position:relative;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 35%, rgba(255,122,69,.07), transparent 70%), var(--s1)}
.body{display:block;width:100%;max-width:380px;margin:0 auto;height:auto}
.body .m{fill:var(--muscle);stroke:var(--s1);stroke-width:1.7;stroke-linejoin:round}
.body .b{fill:var(--base);stroke:var(--s1);stroke-width:1.7;stroke-linejoin:round}
.body .hot{stroke:var(--s1);stroke-width:1.7;stroke-linejoin:round;opacity:var(--o);
  animation:heatIn .8s var(--ease) var(--d) both, heatPulse 3.2s ease-in-out calc(var(--d) + .8s) infinite}
.body .fig-l{fill:var(--dim);font-size:9px;letter-spacing:.2em;text-anchor:middle;font-family:var(--sans);font-weight:700}
@keyframes heatIn{from{opacity:0}to{opacity:var(--o)}}
@keyframes heatPulse{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .72)}}

.mlist{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.mrow{display:grid;grid-template-columns:1fr 38%;grid-template-rows:auto auto;column-gap:10px;row-gap:4px;
  animation:rise .5s var(--ease) var(--d) both}
.mrow span{font-size:12.5px}
.mrow b{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600}
.mtrack{grid-column:1 / -1;height:5px;background:var(--s2);border-radius:999px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:999px;transition:width 1s var(--ease)}
.mcap{font-size:11px;color:var(--dim);margin-top:12px;line-height:1.5}

.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;
  animation:rise .5s var(--ease) var(--d,0s) both;transition:transform .15s var(--ease),border-color .2s}
.exrow:active{transform:scale(.985);border-color:var(--s3)}
.exn{width:28px;height:28px;flex:none;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--muted)}
.exb{flex:1;min-width:0}
.ext{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.exs{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exw{font-family:var(--mono);font-size:13px;text-align:right}
.exw small{display:block;font-size:9.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
.restcard{text-align:center;padding:34px 20px}
.restcard .big{font-size:40px;margin-bottom:6px}

.sug{border-radius:14px;padding:13px 14px;margin:14px 0;background:var(--s2);font-size:13.5px;line-height:1.45;border:1px solid var(--line)}
.sug.up{border-color:rgba(91,200,175,.45);background:linear-gradient(135deg,rgba(91,200,175,.14),rgba(91,200,175,.02)),var(--s2)}
.sug.up b{color:var(--prot)}

/* ---- cardio ---- */
.cardbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;
  animation:rise .5s var(--ease) var(--d,0s) both;transition:transform .15s var(--ease),border-color .2s}
.cardbtn:active{transform:scale(.985);border-color:var(--s3)}
.cardbtn .ic{width:34px;height:34px;flex:none;border-radius:11px;background:var(--s2);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.cardbtn .met{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--s2);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;
  transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1A0C05}
.chip.on.no{background:var(--fat);border-color:var(--fat);color:#2A0A11}
.bigkcal{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.rec{display:flex;gap:11px;padding:13px 14px;background:var(--s1);border:1px solid var(--line);
  border-radius:16px;margin-bottom:8px;animation:rise .5s var(--ease) var(--d,0s) both}
.rec .dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);margin-top:6px}
.rec .rt{font-size:13.5px;font-weight:700;margin-bottom:3px}
.rec .rd{font-size:12.5px;color:var(--muted);line-height:1.5}
.rec .rd b{color:var(--ink);font-weight:650}
.mini{background:none;border:none;color:var(--dim);font-size:12px;padding:4px 8px;
  border:1px solid var(--line);border-radius:999px;transition:color .2s,border-color .2s}
.mini:active{color:var(--fat);border-color:var(--fat)}

/* ---- asistente ---- */
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;
  width:56px;height:56px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#1A0C05;font-size:23px;
  box-shadow:0 10px 28px rgba(255,122,69,.4);transition:transform .18s var(--ease);
  animation:fabIn .6s var(--ease) .3s both}
.fab:active{transform:scale(.9)}
@keyframes fabIn{from{opacity:0;transform:scale(.4) translateY(14px)}to{opacity:1;transform:none}}
.chat-body{position:absolute;left:0;right:0;bottom:0;top:6vh;max-width:560px;margin:0 auto;

<script>
/* ============ almacenamiento ============ */
const KEY='diario_macros_v1';
const Store={
  async get(k){
    if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){}}
    try{return localStorage.getItem(k)}catch(e){return null}
  },
  async set(k,v){
    if(window.storage){try{await window.storage.set(k,v);return}catch(e){}}
    try{localStorage.setItem(k,v)}catch(e){}
  }
};

/* ============ datos: alimentos ============ */
const SEED=[
 ['Pechuga de pollo',165,31,0,3.6],['Huevo',143,12.6,.7,9.5],
 ['Arroz blanco cocido',130,2.7,28,.3],['Pasta cocida',158,5.8,31,.9],
 ['Avena',389,16.9,66,6.9],['Pan integral',247,13,41,3.4],
 ['Patata cocida',87,2,20,.1],['Lentejas cocidas',116,9,20,.4],
 ['Garbanzos cocidos',164,8.9,27,2.6],['Atún al natural',116,26,0,1],
 ['Salmón',208,20,0,13],['Leche entera',61,3.2,4.8,3.3],
 ['Yogur griego natural',97,9,3.6,5],['Queso fresco batido 0%',46,8,4,.2],
 ['Aceite de oliva',884,0,0,100],['Almendras',579,21,22,50],
 ['Aguacate',160,2,9,15],['Plátano',89,1.1,23,.3],
].map(([n,k,p,c,g],i)=>({id:'s'+i,n,k,p,c,g,used:0}));

const MEALS=[['d','Desayuno'],['a','Almuerzo'],['c','Cena'],['s','Snacks']];

/* ============ datos: músculos ============ */
const MUS={
  chestU:['Pecho superior (clavicular)','Pecho sup.'],
  chestM:['Pecho medio (esternal)','Pecho medio'],
  chestL:['Pecho inferior (costal)','Pecho inf.'],
  deltF:['Deltoides anterior','Delt. anterior'],
  deltS:['Deltoides lateral','Delt. lateral'],
  deltR:['Deltoides posterior','Delt. posterior'],
  traps:['Trapecio','Trapecio'],
  upback:['Espalda alta (romboides y redondo)','Espalda alta'],
  lats:['Dorsal ancho','Dorsal'],
  lowback:['Lumbares','Lumbares'],
  biceps:['Bíceps y braquial','Bíceps'],
  triceps:['Tríceps','Tríceps'],
  forearm:['Antebrazo','Antebrazo'],
  abs:['Recto abdominal','Abdomen'],
  obliq:['Oblicuos','Oblicuos'],
  quads:['Cuádriceps','Cuádriceps'],
  adduct:['Aductores','Aductores'],
  abduct:['Abductores (glúteo medio)','Abductores'],
  glutes:['Glúteo mayor','Glúteo'],
  hams:['Isquiotibiales (femoral)','Femoral'],
  calves:['Gemelos','Gemelos'],
};

/* Biblioteca de la rutina. Reparto aproximado del trabajo por músculo (suma 100),
   orientativo a partir de estudios de EMG; cambia con la técnica y la máquina. */
const LIB={
  r_militar:{n:'Press militar',lo:6,hi:10,inc:2.5,
    mus:{deltF:40,triceps:25,deltS:20,chestU:10,traps:5}},
  r_lat:{n:'Elevaciones laterales',lo:10,hi:15,inc:1,
    mus:{deltS:65,traps:15,deltF:12,deltR:8},note:'Codo ligeramente por delante, sube hasta la línea del hombro.'},
  r_bayes:{n:'Curl bayesiano',lo:8,hi:12,inc:1,
    mus:{biceps:85,forearm:10,deltF:5},note:'Con el brazo por detrás del cuerpo estiras la cabeza larga del bíceps.'},
  r_martillo:{n:'Curl martillo',lo:8,hi:12,inc:1,
    mus:{biceps:50,forearm:50},note:'Agarre neutro: carga mucho el braquial y el braquiorradial.'},
  r_nuca:{n:'Extensión de tríceps tras nuca',lo:8,hi:12,inc:2.5,
    mus:{triceps:95,forearm:5},note:'Brazo por encima de la cabeza: énfasis en la cabeza larga.'},
  r_cuerda:{n:'Extensión de tríceps con cuerda',lo:10,hi:15,inc:2.5,
    mus:{triceps:90,forearm:10},note:'Más cabeza lateral y medial; abre la cuerda al final.'},
  r_peck:{n:'Peck deck',lo:10,hi:15,inc:2.5,
    mus:{chestM:45,chestU:25,chestL:20,deltF:10},note:'Trabaja las tres porciones del pecho; la esternal (media) es la que más carga.'},
  r_pullover:{n:'Pull over',lo:10,hi:15,inc:2.5,
    mus:{lats:55,chestL:15,upback:12,triceps:10,deltR:8},note:'Brazos casi rectos, piensa en llevar los codos hacia la cadera.'},
  r_sentadilla:{n:'Sentadilla con cinturón',lo:5,hi:8,inc:2.5,
    mus:{quads:45,glutes:25,adduct:15,lowback:7,hams:4,abs:4}},
  r_abduct:{n:'Abductores',lo:12,hi:20,inc:5,
    mus:{abduct:70,glutes:30},note:'Máquina de abducción: glúteo medio y menor.'},
  r_femoral:{n:'Curl femoral acostado',lo:8,hi:12,inc:2.5,
    mus:{hams:85,calves:15}},
  r_extcuad:{n:'Extensión de cuádriceps',lo:10,hi:15,inc:2.5,
    mus:{quads:100},note:'Aísla el cuádriceps; aguanta un segundo arriba.'},
  r_abs:{n:'Abdominales',lo:12,hi:20,inc:2.5,
    mus:{abs:75,obliq:25},note:'Si es sin carga, pon 0 kg y progresa en repeticiones.'},
  r_incsmith:{n:'Press inclinado en Smith',lo:6,hi:10,inc:2.5,
    mus:{chestU:45,chestM:20,deltF:20,triceps:15},note:'La inclinación desplaza el trabajo a la porción clavicular.'},
  r_frontal:{n:'Elevaciones frontales',lo:10,hi:15,inc:1,
    mus:{deltF:70,chestU:12,deltS:12,traps:6}},
  r_remo:{n:'Remo agarre de dominadas',lo:8,hi:12,inc:2.5,
    mus:{upback:35,lats:20,deltR:20,traps:12,biceps:8,forearm:5},note:'Agarre prono y abierto, codos altos: espalda alta y deltoides posterior.'},
  r_predicador:{n:'Curl predicador',lo:8,hi:12,inc:1,
    mus:{biceps:85,forearm:15},note:'Brazo por delante del cuerpo: más cabeza corta del bíceps.'},
  r_rdl:{n:'Peso muerto rumano',lo:6,hi:10,inc:2.5,
    mus:{hams:45,glutes:30,lowback:15,adduct:5,forearm:5},note:'Cadera atrás, rodilla casi fija, baja hasta notar el femoral estirado.'},
};

/* Rutina UL × PPL. Índice = día de la semana de JS (0 domingo … 6 sábado). */
const ROUTINE={
  1:{t:'Upper',sub:'Torso completo',ex:['r_militar','r_lat','r_bayes','r_martillo','r_nuca','r_cuerda','r_peck','r_pullover']},
  2:{t:'Lower',sub:'Foco cuádriceps',ex:['r_sentadilla','r_abduct','r_femoral','r_extcuad','r_abs']},
  3:{t:'Descanso',sub:'Recuperación',rest:true,ex:[]},
  4:{t:'Push',sub:'Pecho, hombro y tríceps',ex:['r_incsmith','r_peck','r_lat','r_frontal','r_cuerda','r_nuca']},
  5:{t:'Pull',sub:'Espalda y bíceps',ex:['r_pullover','r_remo','r_predicador','r_martillo']},
  6:{t:'Lower',sub:'Foco femoral',ex:['r_rdl','r_abduct','r_extcuad','r_femoral','r_abs']},
  0:{t:'Descanso',sub:'Recuperación',rest:true,ex:[]},
};
const DAYORDER=[1,2,3,4,5,6,0];
const DL={1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',0:'D'};
const DN={1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',0:'Domingo'};
const EXV=2;
// Rutina del usuario: si ha tocado un día, manda su lista; si no, la de serie.
/* ---- splits: varias rutinas guardadas; una activa ---- */
const NOPLAN={t:'Descanso',sub:'Recuperación',rest:true,ex:[]};
function seedSplit(){const days={};
  DAYORDER.forEach(d=>{const r=ROUTINE[d];
    days[d]={t:r.t,sub:r.sub,rest:!!r.rest,ex:(S.myRt&&S.myRt[d])?S.myRt[d].slice():r.ex.slice()}});
  return{id:'sp_ul_ppl',name:'UL × PPL',days}}
function blankDays(){const days={};DAYORDER.forEach(d=>days[d]={t:'Descanso',sub:'Recuperación',rest:true,ex:[]});return days}
function cloneDays(src){const days={};DAYORDER.forEach(d=>{const x=(src&&src[d])||NOPLAN;days[d]={t:x.t,sub:x.sub,rest:!!x.rest,ex:(x.ex||[]).slice()}});return days}
function migrateSplits(){
  if(!Array.isArray(S.splits)||!S.splits.length){S.splits=[seedSplit()];S.activeSplit=S.splits[0].id}
  delete S.myRt;
  S.splits.forEach(sp=>{sp.days=sp.days||{};DAYORDER.forEach(d=>{if(!sp.days[d])sp.days[d]={t:'Descanso',sub:'Recuperación',rest:true,ex:[]};if(!sp.days[d].ex)sp.days[d].ex=[]})});
  if(!S.splits.some(x=>x.id===S.activeSplit))S.activeSplit=S.splits[0].id;
}
function activeSplit(){return Array.isArray(S.splits)&&S.splits.find(x=>x.id===S.activeSplit)||null}
function planOf(d,sp){sp=sp||activeSplit();return(sp&&sp.days&&sp.days[d])||(sp?NOPLAN:ROUTINE[d])||NOPLAN}
function dayEx(d){return planOf(d).ex||[]}

function shift(k,n){const [y,m,d]=k.split('-').map(Number);
  const dt=new Date(y,m-1,d+n);return todayKey(dt)}
function fmtDate(k){const [y,m,d]=k.split('-').map(Number);
  const t=new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return t.charAt(0).toUpperCase()+t.slice(1)}

/* Migra la lista de ejercicios a la rutina actual sin perder el historial. */
function migrateExercises(){
  if(S.exV===EXV&&S.exercises)return;
  const lib=Object.entries(LIB).filter(([id])=>!(S.exDel||[]).includes(id)).map(([id,v])=>({id,n:v.n,lo:v.lo,hi:v.hi,inc:v.inc}));
  const byName={};lib.forEach(e=>byName[e.n.toLowerCase()]=e.id);
  (S.workouts||[]).forEach(w=>{const id=byName[(w.exName||'').toLowerCase()];if(id){w.exId=id;w.exName=LIB[id].n}});
  const used=new Set((S.workouts||[]).map(w=>w.exId));
  const kept=(S.exercises||[]).filter(e=>!LIB[e.id]&&!byName[(e.n||'').toLowerCase()]&&
    (String(e.id).startsWith('xc')||used.has(e.id)));
  S.exercises=[...lib,...kept];S.exV=EXV;
}

/* ============ objetivos ============ */
function computeTarget(){
  const kcal=S.kcal;
  const prot=Math.round(S.peso*S.macros.prot);
  const grasa=Math.round(S.peso*S.macros.grasa);
  const carb=Math.max(0,Math.round((kcal-prot*4-grasa*9)/4));
  return {kcal,prot,carb,grasa};
}

/* ============ totales ============ */
function dayEntries(k){return S.entries.filter(e=>e.f===k)}
function totals(k){
  return dayEntries(k).reduce((t,e)=>({
    kcal:t.kcal+e.kcal,prot:t.prot+e.prot,carb:t.carb+e.carb,grasa:t.grasa+e.grasa
  }),{kcal:0,prot:0,carb:0,grasa:0});
}

/* ============ entreno: lógica ============ */
function weekStart(k){
  const [y,m,d]=k.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const dow=(dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-dow);
  return todayKey(dt);
}
function getEx(id){return S.exercises.find(e=>e.id===id)}
function musOf(x){return (x&&LIB[x.id]&&LIB[x.id].mus)||(x&&x.mus)||{}}
function workoutsFor(exId){
  return S.workouts.filter(w=>w.exId===exId).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
// Doble progresión: si TODAS las series de la última sesión llegan al techo
// del rango, la próxima vez toca subir peso.
function suggestion(exId){
  const x=getEx(exId);
  const last=workoutsFor(exId)[0];
  if(!x||!last)return{text:'Registra tu primera sesión y te diré cuándo toca subir.',up:false};
  const reps=last.sets.map(s=>s.reps);
  const top=Math.max(...reps),bottom=Math.min(...reps),w=last.sets[0].weight;
  if(reps.every(r=>r>=x.hi))
    return{text:`Llegaste a <b>${x.hi}+ reps</b> con ${r1(w)} kg. <b>Toca subir a ${r1(w+x.inc)} kg.</b>`,up:true};
  if(bottom<x.lo)
    return{text:`Te quedaste por debajo de ${x.lo} reps. Mantén ${r1(w)} kg hasta completar el rango.`,up:false};
  return{text:`En rango (${bottom}${top!==bottom?'-'+top:''} reps con ${r1(w)} kg). Suma repeticiones hasta llegar a ${x.hi} antes de subir.`,up:false};
}
/* ============ cardio ============ */
function cardioKcal(met,min){
  // Fórmula estándar del compendio: kcal = MET x peso(kg) x horas.
  return met*S.peso*(min/60);
}
function cardioFor(k){return S.cardioLog.filter(c=>c.date===k)}
function cardioTotal(k){return cardioFor(k).reduce((a,c)=>a+c.kcal,0)}
function getCardio(id){return S.cardios.find(c=>c.id===id)}

/* Gasto en reposo (Mifflin-St Jeor). Solo se usa para orientar
   las recomendaciones, nunca para tocar el objetivo que fija Angel. */
function bmr(){
  return 10*S.peso+6.25*170-5*S.edad+(S.sexo==='h'?5:-161);
}
function gymDone(k){return S.gym[k]}
/* Coste aproximado de una sesión de pesas del estilo que hacen ellos:
   MET 5 durante ~50 min. */
function gymKcal(){return cardioKcal(5,50)}

function recs(k){
  const out=[];
  const t=totals(k), T=S.target;
  const dow=new Date(k.split('-')[0],+k.split('-')[1]-1,k.split('-')[2]).getDay();
  const plan=planOf(dow);
  const g=gymDone(k), cal=cardioTotal(k);
  const esHoy=k===todayKey();

  if(!plan.rest&&g==='no'){
    const falta=Math.max(0,gymKcal()-cal);
    if(falta>40){
      const min=Math.round(falta/cardioKcal(5.8,1))||0;
      const pasos=Math.round(falta/(cardioKcal(3.8,1)*0.75)*100);
      out.push({t:'Te saltaste el entreno',
        d:`Esa sesión ronda las ${r0(gymKcal())} kcal. Para compensar: unos <b>${min} min de bici estática</b> a resistencia media, o <b>${(Math.round(pasos/500)*500).toLocaleString('es-ES')} pasos</b> caminando.`});
    }else{
      out.push({t:'Entreno compensado',
        d:`No fuiste al gimnasio, pero el cardio de hoy ya cubre ese gasto. Nada más que hacer.`});
    }
  }
  if(!plan.rest&&!g&&esHoy)
    out.push({t:'Marca si has ido al gimnasio',
      d:`Hoy toca <b>${plan.t.toLowerCase()}</b>. Dilo en la pestaña Entreno y ajusto las recomendaciones.`});
  if(plan.rest&&!cal&&esHoy)
    out.push({t:'Día de descanso',
      d:'Si quieres sumar algo sin cargar las piernas, 20-30 min de caminata suave no interfieren con la recuperación.'});

  if(t.kcal>0){
    const rest=T.kcal+cal-t.kcal;
    if(cal>0)
      out.push({t:'Cardio de hoy',
        d:`Has quemado <b>${r0(cal)} kcal</b> en cardio. Si quieres mantener el mismo balance, tu margen de hoy sube a <b>${r0(T.kcal+cal)} kcal</b> (${rest>0?r0(rest)+' restantes':r0(-rest)+' pasado'}).`});
    const faltaP=T.prot-t.prot;
    if(faltaP>25)
      out.push({t:'Te falta proteína',
        d:`Llevas ${r0(t.prot)} g de ${T.prot} g. Faltan <b>${r0(faltaP)} g</b>: unos ${Math.round(faltaP/31*100/10)*10} g de pechuga de pollo, o ${Math.round(faltaP/9*100/10)*10} g de yogur griego.`});
  }else if(esHoy){
    out.push({t:'Sin comidas registradas',
      d:`Todavía no has apuntado nada hoy. Tu objetivo son <b>${T.kcal} kcal</b> y <b>${T.prot} g</b> de proteína.`});
  }
  return out;
}

function weeklyLifts(){
  const wk=weekStart(todayKey()),out={};
  S.workouts.filter(w=>w.date>=wk).forEach(w=>{
    w.sets.forEach(s=>{
      const c=out[w.exName];
      if(!c||s.weight>c.weight||(s.weight===c.weight&&s.reps>c.reps))
        out[w.exName]={weight:s.weight,reps:s.reps};
    });
  });
  return out;
}
function weeklyAdherence(){
  const wk=weekStart(todayKey());
  const days=[];
  for(let d=wk;d<=todayKey();d=shift(d,1))days.push(d);
  const hit=days.filter(d=>{
    const t=totals(d);
    if(!t.kcal)return false;
    return Math.abs(t.kcal-S.target.kcal)<=S.target.kcal*0.1;
  }).length;
  return{hit,total:days.length};
}
function dayMus(day){
  const acc={};
  dayEx(day).forEach(id=>{
    const m=musOf(getEx(id)||{id});
    Object.entries(m).forEach(([k,v])=>acc[k]=(acc[k]||0)+v);
  });
  const tot=Object.values(acc).reduce((a,b)=>a+b,0)||1;
  const out={};Object.entries(acc).forEach(([k,v])=>out[k]=Math.round(v/tot*100));
  return out;
}

function heat(t){return `hsl(${Math.round(16+(1-t)*26)},100%,${Math.round(57+(1-t)*9)}%)`}
let svgN=0;
function bodySVG(mus){
  mus=mus||{};
  const id='glow'+(++svgN);
  const max=Math.max(1,...Object.values(mus));
  const rank=Object.keys(mus).sort((a,b)=>mus[b]-mus[a]);
  const fig=(parts,ox,label)=>{
    let base='',hot='';
    parts.forEach(([k,d])=>{
      base+=`<path class="${k==='B'?'b':'m'}" d="${d}"/>`;
      if(k!=='B'&&mus[k]){
        const t=mus[k]/max;
        hot+=`<path class="hot" d="${d}" style="fill:${heat(t)};--o:${(.45+.55*t).toFixed(2)};--d:${(rank.indexOf(k)*.08+.1).toFixed(2)}s"/>`;
      }
    });
    const mir=s=>`<g>${s}</g><g transform="translate(200,0) scale(-1,1)">${s}</g>`;
    return `<g transform="translate(${ox},0)">${mir(base)}<g filter="url(#${id})">${mir(hot)}</g>
      <text x="100" y="438" class="fig-l">${label}</text></g>`;
  };
  return `<svg class="body" viewBox="0 0 420 446" role="img" aria-label="Músculos trabajados">
    <defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    ${fig(FRONT,0,'FRONTAL')}${fig(BACK,220,'POSTERIOR')}</svg>`;
}
function musList(mus,limit){
  const arr=Object.entries(mus).sort((a,b)=>b[1]-a[1]).slice(0,limit||99);
  const max=Math.max(1,...arr.map(a=>a[1]));
  return `<div class="mlist">${arr.map(([k,p],i)=>`
    <div class="mrow" style="--d:${(.15+i*.06).toFixed(2)}s">
      <span>${MUS[k]?MUS[k][0]:k}</span><b>${p}%</b>
      <div class="mtrack"><i style="width:${w0(p/max*100)}%;background:${heat(p/max)}" data-w="${p/max*100}"></i></div>
    </div>`).join('')}</div>`;
}

function render(animate){
  ANIM=!!animate;
  const tabsEl=[...document.querySelectorAll('.tabs button')];
  tabsEl.forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  document.getElementById('tabInd').style.setProperty('--i',tabsEl.findIndex(b=>b.dataset.tab===tab));
  const view=document.getElementById('view');
  view.innerHTML=tab==='hoy'?viewHoy():tab==='entreno'?viewEntreno():tab==='cardio'?viewCardio():tab==='vs'?viewVs():tab==='noticias'?viewNoticias():viewAjustes();
  if(animate){
    view.classList.remove('anim');void view.offsetWidth;view.classList.add('anim');
    animateFills(view);countUps(view);
    try{window.scrollTo(0,0)}catch(e){}
  }
  ANIM=false;
}
function animateFills(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
  }));
}
function countUps(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,t0=performance.now(),dur=900;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e).toLocaleString('es-ES');
      if(p<1)requestAnimationFrame(step);
    };
    el.textContent='0';requestAnimationFrame(step);
  });
}

  const diff=Math.round((new Date(y1,m1-1,d1)-new Date(y2,m2-1,d2))/86400000);

/* ============ arrastrar ejercicios (mantener pulsado) ============ */
let drag=null,pend=null,dragEndAt=0;
function dragBegin(row,pt){
  const list=row.parentNode;
  drag={row,list,pid:pt.id,y:pt.y,grab:pt.y-row.getBoundingClientRect().top,start:[...list.children].map(r=>r.dataset.id).join()};
  list.classList.add('dragging');row.classList.add('lift');document.body.classList.add('dragmode');
  try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}
  requestAnimationFrame(dragTick);
}
function dragTick(){
  if(!drag)return;
  const row=drag.row;
  if(drag.y<110)window.scrollBy(0,-9);else if(drag.y>window.innerHeight-120)window.scrollBy(0,9);
  const kids=()=>[...drag.list.children].filter(c=>c!==row);
  const h=row.offsetHeight,center=drag.y-drag.grab+h/2;
  for(const c of kids()){
    const r=c.getBoundingClientRect(),mid=r.top+r.height/2;
    const after=row.compareDocumentPosition(c)&Node.DOCUMENT_POSITION_FOLLOWING;
    if(after&&center>mid){drag.list.insertBefore(row,c.nextSibling);break}
    if(!after&&center<mid){drag.list.insertBefore(row,c);break}
  }
  row.style.transform='';
  const top=row.getBoundingClientRect().top;
  row.style.transform=`translateY(${drag.y-drag.grab-top}px)`;
  requestAnimationFrame(dragTick);
}
function dragEnd(ok){
  if(!drag)return;
  const d=drag;drag=null;
  d.row.style.transform='';d.row.classList.remove('lift');d.list.classList.remove('dragging');
  document.body.classList.remove('dragmode');
  dragEndAt=Date.now();
  const ids=[...d.list.children].map(r=>r.dataset.id);
  if(ok&&ids.join()!==d.start){setDayEx(selDay,ids);save();if(window.Fire)window.Fire.push()}
  render();
}
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest&&e.target.closest('#exList .exrow');
  if(!row||drag||(e.pointerType==='mouse'&&e.button>0))return;
  if(pend)clearTimeout(pend.timer);
  const pt={x:e.clientX,y:e.clientY,id:e.pointerId};
  pend={pt,timer:setTimeout(()=>{pend=null;dragBegin(row,pt)},e.pointerType==='mouse'?250:380)};
});
document.addEventListener('pointermove',e=>{
  if(drag){if(e.pointerId===drag.pid){drag.y=e.clientY;e.preventDefault()}return}
  if(pend&&Math.hypot(e.clientX-pend.pt.x,e.clientY-pend.pt.y)>9){clearTimeout(pend.timer);pend=null}
},{passive:false});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{
  if(pend){clearTimeout(pend.timer);pend=null}
  if(drag&&e.pointerId===drag.pid)dragEnd(t==='pointerup');
}));
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(drag||pend||(e.target.closest&&e.target.closest('#exList')))e.preventDefault()});
document.addEventListener('click',e=>{
  if(Date.now()-dragEndAt<450&&e.target.closest&&e.target.closest('.exrow')){e.stopPropagation();e.preventDefault()}
},true);

  if(i>=0)a.splice(i,1);else a.push(id);
  setDayEx(d,a);save();
  document.getElementById('exDays').innerHTML=exDaysHtml(id);
  render();

function deleteExercise(id){
  const x=getEx(id);if(!x)return;
  const n=S.workouts.filter(w=>w.exId===id).length;
  if(!confirm('¿Eliminar "'+x.n+'"?\n\nSe quita de la rutina'+(n?' y se borran sus '+n+' sesiones guardadas (también del Vs)':'')+'. No se puede deshacer.'))return;
  (S.splits||[]).forEach(sp=>DAYORDER.forEach(d=>{sp.days[d].ex=(sp.days[d].ex||[]).filter(v=>v!==id)}));
  if(LIB[id]){S.exDel=S.exDel||[];if(!S.exDel.includes(id))S.exDel.push(id)} // de serie: que no vuelva a aparecer
  S.exercises=S.exercises.filter(e=>e.id!==id);
  S.workouts=S.workouts.filter(w=>w.exId!==id);
  save();closeSheet();render();
  if(window.Fire)window.Fire.push();
}

/* ---- ejercicio nuevo: va a los días que elijas y muestra qué músculos trabaja ---- */
let nx={rows:[],days:[]};
function nxMus(){
  const tot=nx.rows.reduce((a,r)=>a+(r.p>0?r.p:0),0);
  if(!tot)return{};
  const m={};nx.rows.forEach(r=>{if(r.p>0)m[r.k]=(m[r.k]||0)+r.p/tot*100});
  Object.keys(m).forEach(k=>m[k]=Math.round(m[k]));
  return m;
}
function nxDraw(){
  const rows=document.getElementById('nxRows');if(!rows)return;
  const opts=k=>Object.entries(MUS).map(([key,v])=>`<option value="${key}" ${key===k?'selected':''}>${v[0]}</option>`).join('');
  rows.innerHTML=nx.rows.map((r,i)=>`<div class="nxrow">
    <select onchange="nx.rows[${i}].k=this.value;nxPrev()">${opts(r.k)}</select>
    <input type="number" inputmode="numeric" min="0" value="${r.p}" aria-label="Porcentaje"
      oninput="nx.rows[${i}].p=parseFloat(this.value)||0;nxPrev()"><em>%</em>
    ${nx.rows.length>1?`<button class="mini" onclick="nx.rows.splice(${i},1);nxDraw()" aria-label="Quitar músculo">✕</button>`:'<span style="width:34px"></span>'}
  </div>`).join('');
  nxPrev();
}
function nxPrev(){
  const m=nxMus(),el=document.getElementById('nxPrev');if(!el)return;
  el.innerHTML=Object.keys(m).length?`${bodySVG(m)}${musList(m,6)}`:'<p class="hint" style="margin:0">Pon un porcentaje para ver qué trabaja.</p>';
}
function nxLike(id){
  if(!id)return;
  const x=getEx(id)||{id};
  const top=Object.entries(musOf(x)).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(!top.length)return;
  nx.rows=top.map(([k,p])=>({k,p}));nxDraw();
}
function nxDay(d){
  const i=nx.days.indexOf(d);if(i>=0)nx.days.splice(i,1);else nx.days.push(d);
  document.getElementById('nxDays').innerHTML=nxDaysHtml();
}
function nxDaysHtml(){
  return trainDays().map(d=>`<button class="dpick ${nx.days.includes(d)?'on':''}" onclick="nxDay(${d})"
    aria-pressed="${nx.days.includes(d)}"><b>${DL[d]}</b><span>${DN[d].slice(0,3)}</span></button>`).join('');
}

function saveExercise(){
  const n=document.getElementById('en').value.trim();
  if(!n){document.getElementById('en').focus();return}
  const mus=nxMus();
  if(!Object.keys(mus).length){alert('Pon al menos un músculo con porcentaje.');return}
  const lo=+document.getElementById('elo').value||8;
  const x={id:'xc'+Date.now(),n,lo,
    hi:Math.max(lo,+document.getElementById('ehi').value||12),
    inc:+document.getElementById('einc').value||2.5,mus};
  S.exercises.push(x);
  nx.days.forEach(d=>setDayEx(d,[...dayEx(d),x.id]));
  if(nx.days.length&&trainDays().includes(nx.days[0]))selDay=nx.days.includes(selDay)?selDay:nx.days[0];
  save();closeSheet();render(true);
}

let cctx={id:null,min:30};
function openCardio(id){
  cctx={id,min:30};
  document.getElementById('sheet').classList.add('on');
  renderCardioSheet();
}
function renderCardioSheet(){
  const c=getCardio(cctx.id);
  const kcal=cardioKcal(c.met,cctx.min);
  document.getElementById('sheetBody').innerHTML=`
    <div class="grab"></div>
    <h2>${esc(c.n)}</h2>
    <p class="hint" style="margin:2px 0 16px">${esc(c.d||'')} · ${c.met} MET</p>
    <div class="field"><label class="eyebrow">Minutos</label>
      <input type="number" inputmode="numeric" id="cmin" value="${cctx.min}" oninput="cprev(this.value)"></div>
    <div class="add" style="margin:-6px 0 14px">
      ${[10,15,20,30,45,60].map(m=>`<button onclick="setMin(${m})">${m} min</button>`).join('')}
    </div>
    <div class="preview">
      <div><div class="v" id="ckcal">${r0(kcal)}</div><div class="eyebrow">kcal</div></div>
      <div><div class="v" id="cmins">${cctx.min}</div><div class="eyebrow">minutos</div></div>
      <div><div class="v">${c.met}</div><div class="eyebrow">MET</div></div>
    </div>
    <button class="btn" onclick="commitCardio()">Añadir</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="closeSheet()">Cancelar</button>`;
}
function cprev(v){
  cctx.min=+v||0;
  const c=getCardio(cctx.id);
  const k=document.getElementById('ckcal'), m=document.getElementById('cmins');
  if(k)k.textContent=r0(cardioKcal(c.met,cctx.min));
  if(m)m.textContent=cctx.min;
}
function setMin(m){
  cctx.min=m;
  const i=document.getElementById('cmin');
  if(i)i.value=m;
  cprev(m);
}
function commitCardio(){
  const c=getCardio(cctx.id);
  if(!cctx.min||cctx.min<=0)return;
  S.cardioLog.push({id:'cl'+Date.now()+Math.random().toString(36).slice(2,5),
    date:cur,cid:c.id,n:c.n,min:cctx.min,kcal:cardioKcal(c.met,cctx.min)});
  save();closeSheet();render();
}
function delCardio(id){S.cardioLog=S.cardioLog.filter(c=>c.id!==id);save();render()}
function openNewCardio(){
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetBody').innerHTML=`
    <div class="grab"></div>
    <h2>Cardio nuevo</h2>
    <p class="hint" style="margin:2px 0 16px">Si conoces el MET de la actividad, ponlo. Si solo sabes
      las kcal por hora que dice internet, ponlas y calculo el MET yo.</p>
    <div class="field"><label class="eyebrow">Nombre</label>
      <input id="cn" style="font-family:var(--sans)" placeholder="Elíptica, remo, natación..."></div>
    <div class="field"><label class="eyebrow">Descripción (opcional)</label>
      <input id="cd" style="font-family:var(--sans)" placeholder="Ritmo, resistencia..."></div>
    <div class="row2">
      <div class="field"><label class="eyebrow">MET</label>
        <input type="number" inputmode="decimal" step="0.1" id="cmet" placeholder="7.5"></div>
      <div class="field"><label class="eyebrow">o kcal por hora</label>
        <input type="number" inputmode="numeric" id="ckh" placeholder="600"></div>
    </div>
    <button class="btn" onclick="saveCardio()">Guardar</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="closeSheet()">Cancelar</button>`;
}
function saveCardio(){
  const n=document.getElementById('cn').value.trim();
  if(!n){document.getElementById('cn').focus();return}
  let met=+document.getElementById('cmet').value||0;
  const kh=+document.getElementById('ckh').value||0;
  // Si dan kcal/hora, el MET sale de dividir por el peso (1 MET ~ 1 kcal/kg/h).
  if(!met&&kh)met=Math.round(kh/S.peso*10)/10;
  if(!met){alert('Pon el MET o las kcal por hora para poder calcular el gasto.');return}
  S.cardios.push({id:'cc'+Date.now(),n,met,d:document.getElementById('cd').value.trim()});
  save();closeSheet();render();
}

function viewVs(){
  const conectado=S.me.fbConfig&&S.me.room&&S.me.name;
  if(!conectado){
    return `
    <div class="datebar"><h1>Vs</h1></div>
    <div class="card"><p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0">
      Aún no has conectado una sala. Ve a <b style="color:var(--ink)">Ajustes → Compartir con un amigo</b>,
      pon tu nombre y un código de sala (el mismo que use tu amigo) y pega la configuración de Firebase.
      En cuanto los dos estéis en la misma sala, aquí veréis quién levanta más esta semana y quién
      cumple más días su objetivo de calorías.</p></div>`;
  }
  const others=window.others||[];
  const people=[{name:S.me.name,me:true,lifts:weeklyLifts(),adherence:weeklyAdherence()},...others];
  const exNames=[...new Set(people.flatMap(p=>Object.keys(p.lifts||{})))];

  const liftBlocks=exNames.length?exNames.map(ex=>{
    const vals=people.map(p=>({name:p.name,me:p.me,...((p.lifts||{})[ex]||{weight:0,reps:0})}));
    const sc=v=>v.reps?v.weight*1000+v.reps:0; // peso primero, repeticiones como desempate
    const maxW=Math.max(...vals.map(sc));
    const winners=vals.filter(v=>sc(v)&&sc(v)===maxW).length;
    return `<div class="card" style="padding:12px 16px">
      <div class="eyebrow" style="margin-bottom:4px">${esc(ex)}</div>
      ${vals.map(v=>{const win=sc(v)&&sc(v)===maxW&&winners===1;return `<div class="vsrow ${win?'win':''}">
        <div class="n">${v.me?'Tú':esc(v.name)}${win?' 🏆':''}</div>
        <div class="v">${!v.reps?'—':v.weight?r1(v.weight)+' kg × '+v.reps:v.reps+' reps'}</div>
      </div>`}).join('')}
    </div>`;
  }).join(''):'<div class="card"><p class="empty" style="margin:0">Nadie ha registrado series esta semana todavía.</p></div>';

  const adhRows=people.map(p=>{
    const a=p.adherence||{hit:0,total:0};
    const pct=a.total?Math.round(a.hit/a.total*100):0;
    return `<div class="rail" style="margin-bottom:12px">
      <div class="rail-key" style="width:64px;font-size:12.5px;font-family:var(--sans);font-weight:650">${p.me?'Tú':esc(p.name)}</div>
      <div class="rail-track"><div class="rail-fill" style="width:${w0(pct)}%;background:var(--prot)" data-w="${pct}"></div></div>
      <div class="rail-val">${a.hit}/${a.total} d</div>
    </div>`;
  }).join('');

  return `
    <div class="datebar"><h1>Vs</h1></div>
    <p class="hint" style="margin:-6px 0 14px">Sala «${esc(S.me.room)}» · mejor peso por ejercicio desde el lunes y días
      cumpliendo el objetivo calórico (±10 %).</p>
    <h2 class="sec" style="margin-top:0">Fuerza</h2>
    ${liftBlocks}
    <h2 class="sec">Adherencia nutricional</h2>
    <div class="card">${adhRows}</div>`;
}

/* ============ micronutrientes ============
   Valores por 100 g (por ración en los platos). La base integrada (MDB) trae
   cifras orientativas de tablas de composición (USDA/BEDCA); marcas y recetas
   varían, así que cada alimento se puede editar y completar a mano. */
const MIC=[
 ['fib','Fibra','g',30,'min'],['azu','Azúcares','g',50,'max'],['sat','Grasa saturada','g',22,'max'],
 ['sod','Sodio','mg',2000,'max'],['pot','Potasio','mg',3500,'min'],['cal','Calcio','mg',1000,'min'],
 ['fe','Hierro','mg',11,'min'],['mg','Magnesio','mg',350,'min'],['zn','Zinc','mg',11,'min'],
 ['fos','Fósforo','mg',700,'min'],['vA','Vitamina A','µg',800,'min'],['vC','Vitamina C','mg',110,'min'],

function micDef(k){

  if(String(k).startsWith('x:')){const p=k.slice(2).split('|');const r=micRef(k,0),c=(S.micCustom||[]).find(x=>x.k===k);return{l:p[0],u:p[1]||'',ref:r,t:c?c.t:(r?'min':'')}}

}

function micScale(m,x){
  if(!m)return undefined;const o={};
  for(const k in m)o[k]=m[k]*x;
  return Object.keys(o).length?o:undefined;
}
function cleanMic(d){
  const o={};
  for(const k in d){const v=parseFloat(d[k]);if(isFinite(v)&&v>=0)o[k]=v}
  return Object.keys(o).length?o:undefined;
}
// micros de una comida registrada: la copia guardada, o (comidas antiguas) la del alimento por nombre
function entryMic(e){
  if(e.mic)return e.mic;
  const f=S.foods.find(x=>x.n.toLowerCase()===String(e.n).toLowerCase());
  return f&&f.m?micScale(f.m,f.combo?e.g:e.g/100):null;
}
function micTotals(k){
  const es=dayEntries(k),sum={};let cov=0;
  es.forEach(e=>{const m=entryMic(e);

  return{sum,cov,n:es.length};
}

/* ============ noticias ============
   Un proceso de GitHub (Action diaria) genera noticias.json en el repositorio.
   La app lo lee de GitHub y se guarda una copia para verlo sin conexión. */
const NEWSKEY='macrow_news',READKEY='macrow_news_read';
let NEWS=null,newsState='idle',newsFilter='todo',newsRead=new Set();
try{NEWS=JSON.parse(localStorage.getItem(NEWSKEY))}catch(e){}
try{newsRead=new Set(JSON.parse(localStorage.getItem(READKEY)||'[]'))}catch(e){}
function newsSources(){
  const u=[],h=location.hostname;
  if(h.endsWith('github.io')){
    const owner=h.split('.')[0],repo=location.pathname.split('/').filter(Boolean)[0];
    if(repo&&!repo.includes('.'))['main','master'].forEach(br=>
      u.push(`https://raw.githubusercontent.com/${owner}/${repo}/${br}/noticias.json`));
  }
  u.push('noticias.json');
  return u;
}
async function loadNews(){
  if(newsState==='loading')return;
  newsState='loading';if(tab==='noticias')render();
  let ok=false;
  for(const u of newsSources()){
    try{
      const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      if(d&&Array.isArray(d.items)){
        if(!NEWS||!NEWS.updated||String(d.updated)>=String(NEWS.updated)){
          NEWS=d;try{localStorage.setItem(NEWSKEY,JSON.stringify(d))}catch(e){}
        }
        ok=true;break;
      }
    }catch(e){}
  }
  newsState=ok?'ok':(NEWS?'offline':'none');
  if(tab==='noticias')render();
}
function ago(iso){
  const m=(Date.now()-new Date(iso).getTime())/6e4;
  if(m<60)return 'hace '+Math.max(1,Math.round(m))+' min';
  if(m<1440)return 'hace '+Math.round(m/60)+' h';
  const d=Math.round(m/1440);
  return d===1?'ayer':d<30?'hace '+d+' días':new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}
function newsBadges(i){
  const today=new Date().toISOString().slice(0,10);
  return [
    i.fs===today&&!newsRead.has(i.id)?'<span class="bd new">Nuevo</span>':'',
    i.hd?'<span class="bd hd">Heavy Duty</span>':'',
    i.est?`<span class="bd est">${esc(i.tipo||'Estudio')}</span>`:'',
    i.cat==='nutricion'?'<span class="bd nu">Nutrición</span>':'<span class="bd">Entreno</span>',
    i.lang==='en'?'<span class="bd">EN</span>':''].join('');
}
function setNewsFilter(f){newsFilter=f;render()}
function viewNoticias(){
  const items=(NEWS&&NEWS.items)||[];
  const F=[['todo','Todo'],['hd','Heavy Duty'],['entreno','Entreno'],['nutricion','Nutrición'],['est','Estudios']];
  const pass=i=>newsFilter==='todo'||(newsFilter==='hd'&&i.hd)||(newsFilter==='est'&&i.est)||newsFilter===i.cat;
  const list=items.filter(pass);
  const dest=list.filter(i=>i.dest).sort((a,b)=>b.sc-a.sc);
  const rest=list.filter(i=>!i.dest).sort((a,b)=>new Date(b.d)-new Date(a.d));
  const loading=newsState==='loading';
  const sub=loading&&!items.length?'Buscando noticias…'
    :NEWS&&NEWS.updated?`Actualizado ${ago(NEWS.updated)}${newsState==='offline'?' · sin conexión, mostrando lo guardado':''}`
    :'';
  const first=(i,n)=>{const t=(i.pts&&i.pts[0]&&i.pts[0].t)||'';return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+'…':t};
  const head=`<div class="datebar"><h1>Noticias</h1>
      <button class="refresh ${loading?'spin':''}" onclick="loadNews()" aria-label="Actualizar">↻</button></div>
    ${sub?`<p class="nsub">${sub}</p>`:''}`;
  if(!items.length){
    return head+`<div class="card"><p style="margin:0 0 8px;font-weight:650">${loading?'Cargando…':'Todavía no hay noticias'}</p>
      <p class="hint" style="margin:0">${loading?'Un momento.':'Las noticias las prepara cada mañana el actualizador automático de tu GitHub. '+
      'En cuanto se ejecute la primera vez aparecerán aquí. Si abres la app desde un archivo del móvil (no desde tu enlace de GitHub) no podrá leerlas.'}</p></div>`;
  }
  return head+`
    <div class="nchips">${F.map(([k,l])=>`<button class="nchip" aria-pressed="${newsFilter===k}" onclick="setNewsFilter('${k}')">${l}</button>`).join('')}</div>
    ${dest.length?`<h2 class="sec">Destacados</h2>${dest.map(i=>`
      <button class="ncard dest ${newsRead.has(i.id)?'read':''}" onclick="openNews('${i.id}')">
        <div class="nmeta">${esc(i.src)} · ${ago(i.d)}</div>
        <div class="nt">${esc(i.t)}</div>
        <div class="nx">${esc(first(i,170))}</div>
        <div class="badges">${newsBadges(i)}</div>
      </button>`).join('')}`:''}
    ${rest.length?`<h2 class="sec">Más noticias</h2><div class="card" style="padding:4px 16px">${rest.map(i=>`
      <button class="nrow ${newsRead.has(i.id)?'read':''}" onclick="openNews('${i.id}')">
        <div class="nmeta">${esc(i.src)} · ${ago(i.d)}</div>
        <div class="nt">${esc(i.t)}</div>
        <div class="badges">${newsBadges(i)}</div>
      </button>`).join('')}</div>`:''}
    ${!list.length?'<p class="empty">No hay noticias en este filtro todavía.</p>':''}
    <p class="hint" style="margin:16px 0 0">Se actualiza solo cada mañana. Destacados: lo más relevante de los últimos días,
      con prioridad a Heavy Duty / alta intensidad y a los estudios con más peso (metaanálisis y ensayos).</p>`;
}
function openNews(id){
  const i=((NEWS&&NEWS.items)||[]).find(x=>x.id===id);if(!i)return;
  newsRead.add(id);try{localStorage.setItem(READKEY,JSON.stringify([...newsRead].slice(-400)))}catch(e){}
  const url=/^https?:\/\//.test(i.url)?i.url:'#';
  const en=i.lang==='en';
  const fecha=new Date(i.d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetBody').innerHTML=`
    <div class="grab"></div>

    <h2 style="margin-top:8px">${esc(i.t)}</h2>

      :'<p class="hint" style="margin:14px 0">Esta fuente no trae resumen. Ábrela completa para leerla.</p>'}
    ${en?'<p class="hint" style="margin:6px 0 0">El resumen está en inglés, como la fuente original. Puedes abrirla traducida al español.</p>':''}
    <div class="nact">
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir noticia completa</a>
      ${en?`<a class="btn ghost" href="https://translate.google.com/translate?sl=auto&tl=es&u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Abrir traducida al español</a>`:''}
      <button class="btn ghost" onclick="closeSheet()">Cerrar</button>
    </div>`;
  if(tab==='noticias')render();
}

/* ============ ajustes: requerimiento de micronutrientes ============ */
function micRef(k,def){const v=S.micRef&&S.micRef[k];return v>0?v:def}
function setMicRef(k,v){
  S.micRef=S.micRef||{};const n=parseFloat(String(v).replace(',','.'));
  if(isFinite(n)&&n>0)S.micRef[k]=n;else delete S.micRef[k];

}
function resetMicRef(){
  if(!confirm('¿Volver a las referencias orientativas de adulto para todos los micronutrientes?'))return;

}
function micHid(k){return(S.micHidden||[]).includes(k)}
function micCustomKeys(){
  const set=new Set((S.micCustom||[]).map(c=>c.k));
  S.foods.forEach(f=>{if(f.m)Object.keys(f.m).forEach(k=>{if(k.startsWith('x:'))set.add(k)})});
  return[...set];
}
let micFormOpen=false;
function toggleMicForm(){micFormOpen=!micFormOpen;render()}
function delMicro(k){
  const d=micDef(k);
  if(!confirm('¿Quitar "'+d.l+'" de tus micronutrientes?\n\nDeja de aparecer en las barras y al añadir alimentos. '+
    'Los datos ya guardados en tus alimentos no se borran y puedes volver a añadirlo cuando quieras.'))return;

function restoreMicros(){S.micHidden=[];save();render()}

// Solo actualiza la lista: el <input> nunca se recrea y el teclado no se cierra.

function backToSearch(){openAdd(ctx.meal)}

function pick(id){

    <div class="grab"></div>

    <div id="pvm"></div>

function curGrams(){
  const f=ctx.food,q=+document.getElementById('qty').value||0;
  return(ctx.mode==='u'&&f.u)?q*f.u.g:q;
}
function setMode(m){
  const f=ctx.food;if(!f||!f.u)return;
  ctx.mode=m;
  document.getElementById('mdG').classList.toggle('on',m==='g');
  document.getElementById('mdU').classList.toggle('on',m==='u');
  document.getElementById('qlab').textContent=m==='u'?'Cantidad en '+pl(f.u.n,2):'Cantidad en gramos';
  const q=document.getElementById('qty');q.value=m==='u'?1:100;q.step=m==='u'?'0.5':'1';

}
function prev(){
  const f=ctx.food,q=curGrams();
  const m=f.combo?q:q/100;
  document.getElementById('pv').innerHTML=`
    <div><div class="v">${r0(f.k*m)}</div><div class="eyebrow">kcal</div></div>
    <div><div class="v" style="color:var(--prot)">${r1(f.p*m)}</div><div class="eyebrow">Prot</div></div>
    <div><div class="v" style="color:var(--carb)">${r1(f.c*m)}</div><div class="eyebrow">Carb</div></div>
    <div><div class="v" style="color:var(--fat)">${r1(f.g*m)}</div><div class="eyebrow">Grasa</div></div>`;
  document.getElementById('pvm').innerHTML=micPreview(f,q);
}
function commit(){
  const f=ctx.food,q=curGrams(),qn=+document.getElementById('qty').value||0;
  if(q<=0)return;
  const m=f.combo?q:q/100;
  // valores copiados, no referenciados: el historial no se reescribe nunca
  S.entries.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,6),
    f:cur,m:ctx.meal,n:f.n,g:q,
    kcal:f.k*m,prot:f.p*m,carb:f.c*m,grasa:f.g*m,mic:micScale(f.m,m),
    un:(ctx.mode==='u'&&f.u)?{q:qn,n:f.u.n}:undefined});
  f.used=(f.used||0)+1;
  save();closeSheet();render();
  if(window.Fire)window.Fire.push();
}


/* ============ editar una comida ya registrada ============ */
let ectx=null;
function foodOfEntry(e){return S.foods.find(x=>x.n.toLowerCase()===String(e.n).toLowerCase())||null}
function editEntry(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  const f=foodOfEntry(e),combo=!!(f&&f.combo);
  let u=null;
  if(!combo){
    if(e.un&&e.un.q>0&&e.g>0)u={n:e.un.n,g:e.g/e.un.q};
    else if(f&&f.u)u={n:f.u.n,g:f.u.g};
  }
  ectx={id,u,combo,mode:(e.un&&u)?'u':'g',meal:e.m};
  document.getElementById('sheet').classList.add('on');
  const q=ectx.mode==='u'?r1(e.un.q):r1(e.g);
  document.getElementById('sheetBody').innerHTML=`
    <div class="grab"></div>
    <h2>${esc(e.n)}</h2>
    <p class="hint" style="margin:2px 0 14px">Cambia la cantidad y se recalculan calorías, macros y micronutrientes de esta comida.</p>
    ${u?`<div class="seg" style="margin-bottom:12px"><button id="edG" class="${ectx.mode==='g'?'on':''}" onclick="eMode('g')">Gramos</button>
      <button id="edU" class="${ectx.mode==='u'?'on':''}" onclick="eMode('u')">${esc(cap(u.n))} · ${r1(u.g)} g</button></div>`:''}
    <div class="field">
      <label class="eyebrow" id="eqlab">${combo?'Raciones':(ectx.mode==='u'?'Cantidad en '+esc(pl(u.n,2)):'Cantidad en gramos')}</label>
      <input type="number" inputmode="decimal" id="eqty" value="${q}" step="${combo||ectx.mode==='u'?'0.5':'1'}" oninput="ePrev()">
    </div>
    <div class="preview" id="epv"></div>
    <div class="eyebrow" style="margin:6px 0 8px">Comida</div>
    <div class="add" id="emeals" style="margin:0 0 16px">${MEALS.map(m=>`<button class="chip ${m[0]===e.m?'on':''}" onclick="eMeal('${m[0]}')">${m[1]}</button>`).join('')}</div>
    <button class="btn" onclick="saveEntry()">Guardar cambios</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="del('${e.id}');closeSheet()" style="color:var(--fat);border-color:rgba(228,114,140,.4)">Quitar esta comida</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="closeSheet()">Cancelar</button>`;
  ePrev();
}
function eGrams(){
  const q=+document.getElementById('eqty').value||0;
  return(ectx.mode==='u'&&ectx.u)?q*ectx.u.g:q;
}
function eMode(m){
  if(!ectx||!ectx.u||ectx.mode===m)return;
  const g=eGrams(),inp=document.getElementById('eqty');
  ectx.mode=m;
  inp.value=m==='u'?Math.max(0.5,Math.round(g/ectx.u.g*2)/2):r0(g);
  inp.step=m==='u'?'0.5':'1';
  document.getElementById('edG').classList.toggle('on',m==='g');
  document.getElementById('edU').classList.toggle('on',m==='u');
  document.getElementById('eqlab').textContent=m==='u'?'Cantidad en '+pl(ectx.u.n,2):'Cantidad en gramos';
  ePrev();
}
function eMeal(m){
  ectx.meal=m;
  [...document.querySelectorAll('#emeals .chip')].forEach((b,i)=>b.classList.toggle('on',MEALS[i][0]===m));
}
function ePrev(){
  const e=S.entries.find(x=>x.id===ectx.id);if(!e)return;
  const g=eGrams(),k=e.g>0?g/e.g:0;
  document.getElementById('epv').innerHTML=`
    <div><div class="v">${r0(e.kcal*k)}</div><div class="eyebrow">kcal</div></div>
    <div><div class="v" style="color:var(--prot)">${r1(e.prot*k)}</div><div class="eyebrow">Prot</div></div>
    <div><div class="v" style="color:var(--carb)">${r1(e.carb*k)}</div><div class="eyebrow">Carb</div></div>
    <div><div class="v" style="color:var(--fat)">${r1(e.grasa*k)}</div><div class="eyebrow">Grasa</div></div>`;
}
function saveEntry(){
  const e=S.entries.find(x=>x.id===ectx.id);if(!e)return;
  const g=eGrams();
  if(g<=0){document.getElementById('eqty').focus();return}
  if(e.g>0){
    const k=g/e.g;
    const mic=entryMic(e);
    e.kcal*=k;e.prot*=k;e.carb*=k;e.grasa*=k;
    if(mic)e.mic=micScale(mic,k);
  }
  const qn=+document.getElementById('eqty').value||0;
  e.g=g;
  if(ectx.mode==='u'&&ectx.u)e.un={q:qn,n:ectx.u.n};else delete e.un;

/* ============ asistente Macrow ============
   Motor local: interpreta la pregunta, la cruza con los datos reales del día
   y responde. No usa internet ni ninguna API de pago.
   Reglas éticas fijas: nunca proponer saltarse una comida, nunca demonizar
   un alimento, nunca bajar de un suelo calórico razonable, y tratar el
   ejercicio como algo que suma, no como castigo por haber comido. */

const CHATKEY='macrow_chat';
let chatLog=[];

function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function has(t,...w){return w.some(x=>t.includes(x))}

/* Extrae cantidades de la frase: kcal, proteína, y el nombre de la comida. */
function numsOf(t){
  const o={};
  let m=t.match(/(\d+[.,]?\d*)\s*(kcal|calor|cal\b)/);
  if(m)o.kcal=parseFloat(m[1].replace(',','.'));
  m=t.match(/(\d+[.,]?\d*)\s*(g|gr|gramos)?\s*(de\s+)?(proteina|prote)/);
  if(m)o.prot=parseFloat(m[1].replace(',','.'));
  m=t.match(/(\d+[.,]?\d*)\s*(g|gr|gramos)?\s*(de\s+)?(carbo|hidratos|carbs)/);
  if(m)o.carb=parseFloat(m[1].replace(',','.'));
  m=t.match(/(\d+[.,]?\d*)\s*(g|gr|gramos)?\s*(de\s+)?(grasas?)/);
  if(m)o.grasa=parseFloat(m[1].replace(',','.'));
  m=t.match(/(\d+)\s*(min|minuto)/);
  if(m)o.min=parseInt(m[1]);
  if(!o.kcal){ // "una hamburguesa de 800" sin unidad
    m=t.match(/de\s+(\d{3,4})\b/);
    if(m)o.kcal=parseFloat(m[1]);
  }
  return o;
}

/* Estado del día, que es lo que hace útil al asistente. */
function dayState(){
  const T=S.target,t=totals(cur),cal=cardioTotal(cur);
  return {T,t,cal,
    presupuesto:T.kcal+cal,
    restan:T.kcal+cal-t.kcal,
    faltaP:Math.max(0,T.prot-t.prot)};
}

const PROTEIN_SOURCES=[
  ['pechuga de pollo',31],['atún al natural',26],['huevo',12.6,'u'],
  ['yogur griego',9],['queso batido 0%',8],['lentejas cocidas',9]];
function porcion(src,g){
  const [nm,per,tipo]=src;
  if(tipo==='u'){ // un huevo M ronda 55 g
    const uds=Math.max(1,Math.round(g/(per*0.55)));
    return `${uds} ${uds===1?'huevo':'huevos'}`;
  }
  return `${Math.round(g/per*100/10)*10} g de ${nm}`;
}

function protTip(g){
  if(g<=0)return'';
  return `unos <b>${porcion(PROTEIN_SOURCES[0],g)}</b> o <b>${porcion(PROTEIN_SOURCES[3],g)}</b>`;
}

/* --- 1. Planificar una comida futura: la pregunta estrella --- */
function planMeal(q,n){
  const d=dayState();
  if(!n.kcal)
    return{a:`Dime las calorías de esa comida y te digo exactamente qué margen te queda.\n\nPor ejemplo: «si ceno una hamburguesa de 800 kcal y 40 de proteína, qué me queda».\n\nAhora mismo llevas <b>${r0(d.t.kcal)}</b> de <b>${r0(d.presupuesto)} kcal</b>, así que te quedan <b>${r0(d.restan)}</b> por repartir.`,
      chips:['¿Cuánto me queda hoy?','¿Cómo llego a la proteína?']};

  const tras=d.restan-n.kcal;
  const FOODS=[['hamburgues','la hamburguesa'],['pizza','la pizza'],['kebab','el kebab'],
    ['pasta','la pasta'],['helado','el helado'],['dulce','ese dulce'],['postre','el postre'],
    ['chocolate','el chocolate'],['cerveza','eso'],['burger','la burger'],['sushi','el sushi'],
    ['bocadillo','el bocadillo'],['tarta','la tarta'],['arroz','ese plato'],['asado','ese plato']];
  const fm=FOODS.find(([k])=>q.includes(k));
  const nombre=fm?fm[1]:'eso';
  const cena=/cen|noche|esta noche/.test(q);
  const otras=cena?'el almuerzo y la merienda':'el resto del día';
  let a='';

  if(tras>=0){
    const suelo=d.T.kcal*0.18;
    a=`Te cabe sin problema.\n\nLlevas <b>${r0(d.t.kcal)} kcal</b> y tu margen de hoy es <b>${r0(d.presupuesto)}</b>${d.cal>0?` (${d.T.kcal} + ${r0(d.cal)} del cardio)`:''}. Restando esas <b>${r0(n.kcal)} kcal</b>, te quedan <b>${r0(tras)} kcal</b> para ${otras}.`;
    if(tras<suelo)
      a+=`\n\nEso es poco para repartir en dos comidas. No te saltes ninguna: es mejor hacerlas más ligeras (ensalada grande con proteína magra, verdura y algo de fruta) que quedarte sin comer.`;
    else
      a+=`\n\nCon ese margen te da de sobra para dos comidas normales. Reparte algo así: ~<b>${r0(tras*0.6)} kcal</b> en la principal y ~<b>${r0(tras*0.4)}</b> en la otra.`;
  }else{
    const pasa=-tras;
    const pct=pasa/d.presupuesto;
    a=`Te pasarías <b>${r0(pasa)} kcal</b>.\n\nLlevas ${r0(d.t.kcal)} de ${r0(d.presupuesto)} kcal, y esa comida son ${r0(n.kcal)}. Cómete ${nombre} si te apetece: ningún alimento suelto arruina nada. Lo que decide resultados es la media de la semana, no un día.\n\nOpciones, por si quieres cuadrarlo:`;
    a+=`\n• <b>Aligerar ${otras}</b>: déjalo en ~${r0(Math.max(d.T.kcal*0.18,d.restan-n.kcal+pasa*0.6))} kcal con proteína magra y verdura, y recortas buena parte.`;
    const min=Math.round(pasa/cardioKcal(5.8,1));
    if(min>0&&min<=75)
      a+=`\n• <b>${min} min de bici estática</b> a resistencia media compensan esas ${r0(pasa)} kcal.`;
    a+=`\n• <b>No hacer nada</b>: ${r0(pasa)} kcal de más en un día es ${pct<0.12?'ruido, ni se nota':'asumible si el resto de la semana cuadra'}.`;
    if(pct>0.35)
      a+=`\n\nUn aviso honesto: eso es mucho de golpe. Si te pasa a menudo, el problema no es la hamburguesa, es que el objetivo diario puede estar demasiado bajo para cómo comes. Revísalo en Ajustes.`;
  }

  const pDespues=d.faltaP-(n.prot||0);
  if(n.prot)
    a+=`\n\n<b>Proteína:</b> con esos ${r0(n.prot)} g te quedarían ${pDespues>0?`<b>${r0(pDespues)} g</b> por cubrir (${protTip(pDespues)})`:'ya cubiertos los '+d.T.prot+' g del día'}.`;
  else if(d.faltaP>20)
    a+=`\n\nOjo con la proteína: te faltan <b>${r0(d.faltaP)} g</b> hoy. Al elegir lo demás, prioriza que lleve proteína.`;

  return{a,chips:['¿Cuánto me queda hoy?','¿Cuánta proteína necesito al día?']};
}

/* --- 2. Preguntas sobre un ejercicio (anatomía y técnica) --- */
function exerciseAnswer(t){
  let best=null,score=0;
  Object.entries(LIB).forEach(([id,v])=>{
    const n=norm(v.n);
    let sc=0;
    if(t.includes(n))sc=n.length*2;
    else{
      const w=n.split(/\s+/).filter(x=>x.length>3);
      w.forEach(x=>{if(t.includes(x))sc+=x.length});
    }
    if(/peck|pec d|peckd/.test(t)&&id==='r_peck')sc+=40;
    if(/militar|hombro press/.test(t)&&id==='r_militar')sc+=30;
    if(/rumano|rdl|muerto/.test(t)&&id==='r_rdl')sc+=30;
    if(/bayesian|bayes/.test(t)&&id==='r_bayes')sc+=30;
    if(sc>score){score=sc;best=[id,v]}
  });
  if(!best||score<5)return null;
  const [id,v]=best;
  const x=getEx(id);
  const arr=Object.entries(v.mus).sort((a,b)=>b[1]-a[1]);
  let a=`<b>${v.n}</b> — reparto aproximado del trabajo:\n`;
  arr.forEach(([k,p])=>{a+=`\n• ${MUS[k]?MUS[k][0]:k}: <b>${p}%</b>`});
  if(v.note)a+=`\n\n${v.note}`;
  if(x)a+=`\n\nEn tu rutina lo llevas a <b>${x.lo}-${x.hi} reps</b>, subiendo ${r1(x.inc)} kg cuando completas el rango.`;
  const last=workoutsFor(id)[0];
  if(last)a+=`\nÚltima sesión: ${last.sets.map(z=>z.reps+'×'+r1(z.weight)+' kg').join(' · ')} (${fmtRel(last.date)}).`;
  const dias=DAYORDER.filter(d=>dayEx(d).includes(id)).map(d=>DN[d].toLowerCase());
  if(dias.length)a+=`\nLo entrenas: ${dias.join(' y ')}.`;
  a+=`<em>Porcentajes orientativos de estudios de EMG. Cambian con la técnica y la máquina.</em>`;
  return{a,chips:['¿Cuándo subo peso?','¿Cuántas series por músculo a la semana?']};
}

   nutriente: calorías, macros, minerales, vitaminas y los micros que hayas creado. */
const NUTRX=[
 ['kcal',/\b(calorias?|kcal|energia)\b/],['prot',/\b(proteinas?|prote)\b/],
 ['carb',/\b(carbohidratos?|hidratos?|carbos?|carbs)\b/],
 ['sat',/\b(grasas?\s+saturadas?|saturadas?)\b/],['grasa',/\bgrasas?\b/],
 ['fib',/\bfibra\b/],['azu',/\bazucar(es)?\b/],['sod',/\b(sodio|sal)\b/],
 ['pot',/\bpotasio\b/],['cal',/\bcalcio\b/],['fe',/\bhierro\b/],['mg',/\bmagnesio\b/],['zn',/\b(zinc|cinc)\b/],
 ['fos',/\bfosforo\b/],['vA',/\b(vitamina\s*a|vit\.?\s*a|retinol)\b/],['vC',/\b(vitamina\s*c|vit\.?\s*c|acido ascorbico)\b/],
 ['vD',/\b(vitamina\s*d|vit\.?\s*d)\b/],['vE',/\b(vitamina\s*e|vit\.?\s*e)\b/],
 ['b12',/\b(b\s*12|cobalamina)\b/],['fol',/\b(folato|acido folico|b\s*9)\b/]];
const MACRO_KEYS=['kcal','prot','carb','grasa'];
function nutIn(t){
  for(const[k,rx]of NUTRX)if(rx.test(t))return k;
  for(const k of micCustomKeys()){if(micHid(k))continue;const nm=norm(micDef(k).l);if(nm.length>2&&t.includes(nm))return k}

}
function nutMeta(k,nd){
  const T=S.target;
  if(k==='kcal')return{l:'calorías',u:'kcal',ref:T.kcal*nd,t:'ref',macro:1};
  if(k==='prot')return{l:'proteína',u:'g',ref:T.prot*nd,t:'ref',macro:1};
  if(k==='carb')return{l:'carbohidratos',u:'g',ref:T.carb*nd,t:'ref',macro:1};

function entVal(e,k){
  if(k==='kcal')return e.kcal||0;if(k==='prot')return e.prot||0;
  if(k==='carb')return e.carb||0;if(k==='grasa')return e.grasa||0;
  const m=entryMic(e);return m&&m[k]?m[k]:0;
}
function foodVal(f,k){
  if(k==='kcal')return f.k||0;if(k==='prot')return f.p||0;if(k==='carb')return f.c||0;if(k==='grasa')return f.g||0;
  return f.m&&f.m[k]?f.m[k]:0;

function daysBetween(a,b){const o=[];for(let d=a;d<=b;d=shift(d,1))o.push(d);return o}
function scopeOf(t){
  if(has(t,'ayer'))return{label:'ayer',days:[shift(todayKey(),-1)]};
  if(has(t,'esta semana','la semana','semanal'))return{label:'esta semana',days:daysBetween(weekStart(todayKey()),todayKey())};
  return{label:cur===todayKey()?'hoy':fmtDate(cur).toLowerCase(),days:[cur]};
}
function rankNut(days,k){
  const es=days.flatMap(d=>dayEntries(d)),by={};
  es.forEach(e=>{const key=norm(e.n),o=by[key]||(by[key]={n:e.n,v:0,g:0,c:0});o.v+=entVal(e,k);o.g+=e.g;o.c++});
  const rows=Object.values(by).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const sin=MACRO_KEYS.includes(k)?[]:[...new Set(es.filter(e=>{const m=entryMic(e);return!(m&&Object.keys(m).length)}).map(e=>e.n))];
  return{rows,tot:rows.reduce((a,r)=>a+r.v,0),sin,n:es.length};
}
function portionOf(f){

// alimentos de tu lista que más aportan, por ración habitual
function sourcesOf(k,limit){
  return S.foods.filter(f=>!f.combo&&foodVal(f,k)>0).map(f=>{
    const po=portionOf(f);return{f,po,amt:foodVal(f,k)*po.g/100,dens:foodVal(f,k)};

const STOPF=new Set(['cocido','cocida','cocidos','cocidas','natural','crudo','cruda','normal','unidad','pequena','entera','corregido','corregida','para','como','tiene','tienen','mas','hoy','quiero','algo','esto','cuanto','cuanta','cual']);
function findFoods(t){
  const words=[...new Set(t.split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!STOPF.has(w)))];
  const toks=f=>norm(String(f.n).replace(/\(.*?\)/g,'')).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!STOPF.has(w)).map(w=>w.replace(/s$/,''));
  const out=[];
  words.forEach(w=>{
    const ws=w.replace(/s$/,'');
    let best=null,bs=0;
    S.foods.forEach(f=>{
      if(f.combo)return;
      const tk=toks(f);if(!tk.includes(ws))return;
      const sc=1/tk.length-String(f.n).length/1000;
      if(sc>bs){bs=sc;best=f}
    });
    if(best&&!out.includes(best))out.push(best);
  });
  return out.slice(0,3);
}
const pc=(a,b)=>b?r0(a/b*100)+'%':'';
function foodCard(f){
  let a=`<b>${esc(f.n)}</b> (por 100 g): ${r0(f.k)} kcal · P ${r1(f.p)} · C ${r1(f.c)} · G ${r1(f.g)}`;
  if(f.u)a+=`\n1 ${esc(f.u.n)} = ${r1(f.u.g)} g → ${r0(f.k*f.u.g/100)} kcal`;
  if(f.m){
    const top=Object.keys(f.m).map(k=>{const d=micDef(k);return{k,d,p:d.ref&&d.t!=='max'?f.m[k]/d.ref*100:0}})
      .filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,4);
    if(top.length)a+=`\n\nDestaca en: ${top.map(x=>`${x.d.l.toLowerCase()} ${fm(f.m[x.k])} ${esc(x.d.u)} (${r0(x.p)}%)`).join(' · ')}.`;
  }else a+=`\n\n<em>Sin micronutrientes guardados. Puedes añadirlos con «Editar».</em>`;
  return a;
}
function nutriAnswer(t,k){

    }

  const wantTop=vals&&has(t,'mas','mayor','principal','top','quien','cual','que','de donde');

        :gap>0?`${cap(sc.label)} llevas <b>${fmtv(R.tot)}</b> de ${m.l} y te faltan <b>${fmtv(gap)}</b> para tu referencia (${fmtv(m.ref)}).\n\n`
        :`${cap(sc.label)} ya llegas a tu referencia de ${m.l}: <b>${fmtv(R.tot)}</b> de ${fmtv(m.ref)} ✓\n\n`;
    }
    if(!src.length)return{a:a+`No tienes guardado ${m.l} en ninguno de tus alimentos. Añádelo con «Editar» y te digo cuáles te sirven.`,chips};
    a+=isMax?`De tu lista, los que más suman por ración:\n`:`De tu lista, los que más aportan por ración:\n`;
    src.forEach(x=>{a+=`\n• ${esc(x.f.n)} (${x.po.lab}): <b>${fmtv(x.amt)}</b>${m.ref&&nd===1?` · ${pc(x.amt,m.ref)} del día`:''}`});
    if(NUTINFO[k])a+=`\n\n<em>${NUTINFO[k]}</em>`;
    if(!m.macro&&['fe','vD','b12','fol','cal','zn'].includes(k))a+=`<em>Si sospechas una carencia real, lo fiable es un análisis con tu médico; no hace falta suplementar a ciegas.</em>`;
    return{a,chips:['¿Qué me dio más '+(m.macro?'proteína':m.l)+'?','¿Qué me falta hoy?']};

  }else{

  }

  return{a,chips:['¿De dónde saco más '+m.l+'?','¿Qué me falta hoy?']};
}
// resumen de micros del día: qué falta y qué se pasa
function microOverview(t){
  const sc=scopeOf(t),nd=sc.days.length,sum={};
  sc.days.flatMap(d=>dayEntries(d)).forEach(e=>{const m=entryMic(e);if(m)for(const k in m)sum[k]=(sum[k]||0)+m[k]});
  const keys=micKeys(sum);
  if(!keys.length)return{a:`${cap(sc.label)} no tengo micronutrientes de tus comidas. Registra comidas o añade micros con «Editar» en cada alimento.`,chips:['¿Cuánto me queda hoy?']};
  const low=[],high=[],ok=[];
  MIC.map(x=>x[0]).concat(micCustomKeys()).filter(k=>!micHid(k)).forEach(k=>{
    const d=micDef(k);if(!d.ref)return;const ref=d.ref*nd,v=sum[k]||0,p=v/ref*100;
    if(d.t==='max'){if(p>100)high.push({k,d,v,p});}
    else if(k in sum){if(p<50)low.push({k,d,v,p});else ok.push({k,d,p})}
  });
  low.sort((a,b)=>a.p-b.p);

      a+=`\n• ${esc(x.d.l)}: ${fm(x.v)} ${esc(x.d.u)} (${r0(x.p)}%)${s1?` → ${esc(s1.f.n)} (${s1.po.lab})`:''}`});

  if(ok.length)a+=`\n\n<b>Bien (50% o más):</b> ${ok.sort((p,q)=>q.p-p.p).map(x=>esc(x.d.l.toLowerCase())).join(', ')}.`;

  return{a,chips:['¿Qué me dio más magnesio?','¿De dónde saco más hierro?']};
